bio: |
  I am an applied mathematician who is passionate about modelling complex systems using probabilistic and statistical tools. 
  
  During my PhD at MaIAGE, INRAE under the supervision of [Patrick Hoshceit](https://genome.jouy.inra.fr/~phoscheit/), Elisabeta Vergu and [Estelle Khun](https://maiage.inrae.fr/estelle-kuhn), I focused on developing spatialy embedded probabilistic models to help understand the commercial cattle network in France using random graph models. I was particularly interested in the spread of epidemics on random graphs, as well as parameter inference using approximate statistical methods based on simulations.
